<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Side Projects - small local experiments that become useful tools">
  <title>Side Projects</title>
  <defs>
    <linearGradient id="spbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090A16"/>
      <stop offset="52%" stop-color="#17132D"/>
      <stop offset="100%" stop-color="#0D2631"/>
    </linearGradient>
    <linearGradient id="spacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB86B"/>
      <stop offset="48%" stop-color="#FF6B9A"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="spglow" cx="0.74" cy="0.42" r="0.62">
      <stop offset="0%" stop-color="#FF6B9A" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FF6B9A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="spgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#B49CFF" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="spcard"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#spcard)">
    <rect width="1200" height="340" fill="url(#spbg)"/>
    <rect width="1200" height="340" fill="url(#spgrid)"/>
    <ellipse cx="910" cy="110" rx="420" ry="230" fill="url(#spglow)"/>
    <rect width="6" height="340" fill="url(#spacc)"/>

    <text x="58" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="49" font-weight="700" fill="#F7F5FF">side projects</text>
    <text x="60" y="129" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="#B8B7D1">Small local experiments for measuring, seeing, and building with AI.</text>

    <g transform="translate(58,165)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <rect x="0" y="0" width="132" height="38" rx="19" fill="#302216" stroke="#FFB86B" stroke-opacity="0.6"/>
      <text x="66" y="24" text-anchor="middle" font-size="12" fill="#FFE0AE">measure</text>
      <rect x="146" y="0" width="132" height="38" rx="19" fill="#301827" stroke="#FF6B9A" stroke-opacity="0.6"/>
      <text x="212" y="24" text-anchor="middle" font-size="12" fill="#FFC0D3">observe</text>
      <rect x="292" y="0" width="132" height="38" rx="19" fill="#102A2D" stroke="#5EEAD4" stroke-opacity="0.6"/>
      <text x="358" y="24" text-anchor="middle" font-size="12" fill="#B8FFF3">experiment</text>
    </g>

    <g transform="translate(58,244)">
      <rect width="3" height="60" fill="url(#spacc)"/>
      <text x="18" y="19" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#8E8BA8" letter-spacing="1.6">THE BIAS</text>
      <text x="18" y="46" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#F7F5FF">Build small. Measure honestly. Keep the loop local.</text>
    </g>

    <g transform="translate(820,47)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <rect x="18" y="142" width="92" height="48" rx="10" fill="#2D2118" stroke="#FFB86B" stroke-opacity="0.7"/>
      <rect x="142" y="84" width="92" height="48" rx="10" fill="#2B1825" stroke="#FF6B9A" stroke-opacity="0.7"/>
      <rect x="266" y="25" width="92" height="48" rx="10" fill="#102A2D" stroke="#5EEAD4" stroke-opacity="0.7"/>
      <line x1="110" y1="166" x2="142" y2="108" stroke="url(#spacc)" stroke-width="2"/>
      <line x1="234" y1="108" x2="266" y2="49" stroke="url(#spacc)" stroke-width="2"/>
      <text x="64" y="171" text-anchor="middle" font-size="12" fill="#FFE0AE">measure</text>
      <text x="188" y="113" text-anchor="middle" font-size="12" fill="#FFC0D3">see</text>
      <text x="312" y="54" text-anchor="middle" font-size="12" fill="#B8FFF3">build</text>
      <circle cx="64" cy="232" r="7" fill="#FFB86B"/>
      <circle cx="188" cy="232" r="7" fill="#FF6B9A"/>
      <circle cx="312" cy="232" r="7" fill="#5EEAD4"/>
      <line x1="64" y1="232" x2="312" y2="232" stroke="#8C82A9" stroke-opacity="0.45" stroke-dasharray="4 6"/>
      <text x="45" y="262" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#A39DB8" letter-spacing="1.3">LOCAL AI WORKBENCH</text>
    </g>
  </g>
</svg>
