<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Image Craft Lab — one photo, three transformations">
  <title>Image Craft Lab</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090A16"/>
      <stop offset="52%" stop-color="#17132D"/>
      <stop offset="100%" stop-color="#0D2631"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB86B"/>
      <stop offset="48%" stop-color="#FF6B9A"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.42" r="0.62">
      <stop offset="0%" stop-color="#FF6B9A" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FF6B9A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#B49CFF" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <ellipse cx="910" cy="110" rx="420" ry="230" fill="url(#glow)"/>
    <rect width="6" height="340" fill="url(#acc)"/>

    <text x="58" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="42" font-weight="700" fill="#F7F5FF">image craft lab</text>
    <text x="60" y="122" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#B8B7D1">One photo → ASCII • PIXEL • PALETTE. Pure Pillow, no model, no API.</text>

    <g transform="translate(58,158)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <rect x="0" y="0" width="132" height="38" rx="19" fill="#302216" stroke="#FFB86B" stroke-opacity="0.6"/>
      <text x="66" y="24" text-anchor="middle" font-size="12" fill="#FFE0AE">ascii</text>
      <rect x="146" y="0" width="132" height="38" rx="19" fill="#301827" stroke="#FF6B9A" stroke-opacity="0.6"/>
      <text x="212" y="24" text-anchor="middle" font-size="12" fill="#FFC0D3">pixel</text>
      <rect x="292" y="0" width="132" height="38" rx="19" fill="#102A2D" stroke="#5EEAD4" stroke-opacity="0.6"/>
      <text x="358" y="24" text-anchor="middle" font-size="12" fill="#B8FFF3">palette</text>
    </g>

    <g transform="translate(58,236)">
      <rect width="3" height="60" fill="url(#acc)"/>
      <text x="18" y="19" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#8E8BA8" letter-spacing="1.6">THE PITCH</text>
      <text x="18" y="46" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#F7F5FF">Presets with live thumbnails + Full Control. Export in one click.</text>
    </g>

    <g transform="translate(820,47)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <!-- ASCII block mock -->
      <rect x="10" y="25" width="110" height="72" rx="10" fill="#1a1a22" stroke="#FFB86B" stroke-opacity="0.5"/>
      <text x="65" y="45" text-anchor="middle" font-size="16" fill="#FFB86B">A</text>
      <text x="65" y="62" text-anchor="middle" font-size="8" fill="#B8B7D1">.:-=+*#%@</text>
      <text x="65" y="76" text-anchor="middle" font-size="7" fill="#8E8BA8">120 cols</text>
      <!-- PIXEL block mock -->
      <rect x="132" y="25" width="110" height="72" rx="10" fill="#1a1a22" stroke="#FF6B9A" stroke-opacity="0.5"/>
      <!-- 4x4 pixel grid -->
      <g transform="translate(158,38)">
        <rect x="0" y="0" width="14" height="14" fill="#FF6B9A"/><rect x="16" y="0" width="14" height="14" fill="#5EEAD4"/>
        <rect x="32" y="0" width="14" height="14" fill="#FFB86B"/><rect x="0" y="16" width="14" height="14" fill="#5EEAD4"/>
        <rect x="16" y="16" width="14" height="14" fill="#1a1a22" stroke="#333" stroke-width="0.5"/><rect x="32" y="16" width="14" height="14" fill="#FF6B9A"/>
      </g>
      <text x="187" y="76" text-anchor="middle" font-size="7" fill="#8E8BA8">64×64 • 16c</text>
      <!-- PALETTE block mock -->
      <rect x="254" y="25" width="110" height="72" rx="10" fill="#1a1a22" stroke="#5EEAD4" stroke-opacity="0.5"/>
      <g transform="translate(270,38)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#FF6B9A"/><rect x="20" y="0" width="18" height="18" rx="4" fill="#FFB86B"/>
        <rect x="40" y="0" width="18" height="18" rx="4" fill="#5EEAD4"/><rect x="60" y="0" width="18" height="18" rx="4" fill="#8B5CF6"/>
      </g>
      <text x="309" y="76" text-anchor="middle" font-size="7" fill="#8E8BA8">5 swatches</text>

      <line x1="65" y1="97" x2="65" y2="145" stroke="#FFB86B" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="187" y1="97" x2="187" y2="145" stroke="#FF6B9A" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="309" y1="97" x2="309" y2="145" stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 4"/>
      <rect x="10" y="145" width="354" height="38" rx="10" fill="#1a1a22" stroke="#B49CFF" stroke-opacity="0.25"/>
      <text x="187" y="168" text-anchor="middle" font-size="10" fill="#F7F5FF">upload one photo → three studios</text>
      <circle cx="65" cy="215" r="6" fill="#FFB86B"/>
      <circle cx="187" cy="215" r="6" fill="#FF6B9A"/>
      <circle cx="309" cy="215" r="6" fill="#5EEAD4"/>
      <line x1="65" y1="215" x2="309" y2="215" stroke="#8C82A9" stroke-opacity="0.35" stroke-dasharray="4 6"/>
      <text x="187" y="248" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="10" fill="#A39DB8" letter-spacing="1.2">SHAREABLE LAB • 5-SECOND WOW</text>
    </g>
  </g>
</svg>
